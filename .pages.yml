media:
  input: images
  output: images
  rename: safe
  categories: [image]

content:
  - name: frame-by-frame
    label: Frame by Frame
    type: file
    path: frames.json
    format: json
    fields:
      - name: frames
        label: Film Photographs
        type: object
        list: true
        fields:

          - name: image
            label: Upload Photograph
            type: image
            required: true

          - name: title
            label: Photo Title
            type: string
            required: true

          - name: stock
            label: Film Stock
            type: string

          - name: comment
            label: Notes From Behind the Lens
            type: text
